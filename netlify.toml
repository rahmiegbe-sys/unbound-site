[build]
  publish = "."

# ============================================================
# Caching
# ------------------------------------------------------------
# Images and the logo rarely change once deployed — cache them hard.
# HTML, CSS, and JS are versioned by redeploy, not by filename, so
# they get a short cache instead, ensuring visitors get updates
# without needing a hard refresh.
# ============================================================
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ============================================================
# Security headers
# ------------------------------------------------------------
# CSP allows: same-origin assets, Google Fonts, the GSAP/Chart.js
# CDN (cdnjs), and fetch/XHR to wherever the backend is deployed.
# If you change UB_API_BASE in config.js to a new domain, add that
# domain to connect-src below too, or API calls will be blocked.
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://nominatim.openstreetmap.org https: http://localhost:4000; frame-ancestors 'none'"
